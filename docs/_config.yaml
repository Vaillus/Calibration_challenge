languages: ["fr", "en"]
default_lang: "fr"

t:
  fr:
    title: "Défi de Calibration - Blog de Recherche"
    description: "Documentation du projet de calibration de caméra"
    lang_name: "Français"
    other_lang: "en"
    other_lang_name: "English"
  en:
    title: "Calibration Challenge - Research Blog"
    description: "Camera calibration project documentation"
    lang_name: "English"
    other_lang: "fr"
    other_lang_name: "Français"
baseurl: "/Calibration_challenge"  # ⬅️ Exact nom du repo
url: "https://Vaillus.github.io" 

# Utilise remote_theme au lieu de theme
remote_theme: "mmistakes/minimal-mistakes@4.27.2"

markdown: kramdown
kramdown:
  math_engine: mathjax
highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-include-cache  # nécessaire pour minimal-mistakes

# Inclure les dossiers d'assets
include:
  - imgs

# Garder les assets lors du build
keep_files:
  - imgs

# Extensions statiques autorisées
static_files:
  - "*.gif"
  - "*.png"
  - "*.jpg"
  - "*.jpeg"

# Valeurs par défaut pour les pages
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "dynamic_toc"
      author: "Hugo Vaillaud"
      show_date: true